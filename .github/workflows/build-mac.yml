name: build-mac

# 手动触发：GitHub 仓库 Actions 页签 → build-mac → Run workflow
# 产物（dmg/zip，arm64 + x64）在该次运行的 Artifacts 区下载，保留 30 天
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build macOS packages (arm64 + x64)
        run: node scripts/dist.js --mac --arm64 --x64
        env:
          ELECTRON_BUILDER_BINARIES_MIRROR: https://npmmirror.com/mirrors/electron-builder-binaries/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mac-dist
          path: |
            release/*.dmg
            release/*.zip
          retention-days: 30
